name: Production Rollback on Private EC2

on:
  workflow_dispatch:
    inputs:
      git_commit:
        description: "Commit SHA to roll back to"
        required: true

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  INSTANCE_ID: ${{ secrets.PROD_INSTANCE_ID }}

jobs:
  rollback:
    name: Rollback Production Deployment
    runs-on: ubuntu-latest
    environment: production

    steps:
      # Checkout repository
      - name: Checkout source code
        uses: actions/checkout@v4

      # Configure AWS credentials using OIDC
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Roll back to a specific commit using SSM
      - name: Rollback application via SSM
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Production rollback from GitHub Actions" \
            --parameters 'commands=[
              "set -e",
              "cd /app",
              "git fetch --all",
              "git checkout '${{ github.event.inputs.git_commit }}'",
              "docker compose up -d --build",
              "docker image prune -f"
            ]' \
            --query 'Command.CommandId' \
            --output text)

          echo "Command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query 'StandardOutputContent' \
            --output text