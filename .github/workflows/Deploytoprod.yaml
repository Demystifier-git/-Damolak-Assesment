name: Production Deploy to Private EC2

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Git branch to deploy"
        required: true
        default: "main"

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  INSTANCE_ID: ${{ secrets.PROD_INSTANCE_ID }}

jobs:
  deploy:
    name: Build, Test and Deploy to Private EC2
    runs-on: ubuntu-latest
    environment: production

    steps:
      # Checkout repository
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}

      # Basic test (customize as needed)
      - name: Run basic tests
        run: |
          echo "Running basic validation..."
          test -f docker-compose.yaml
          echo "Tests passed."

      # Configure AWS credentials using OIDC
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Deploy to private EC2 using AWS Systems Manager (SSM)
      - name: Deploy application via SSM
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Production deployment from GitHub Actions" \
            --parameters 'commands=[
              "set -e",
              "cd /app",
              "git fetch origin",
              "git checkout '${{ github.event.inputs.branch }}'",
              "git reset --hard origin/'${{ github.event.inputs.branch }}'",
              "docker compose pull || true",
              "docker compose up -d --build",
              "docker image prune -f"
            ]' \
            --query 'Command.CommandId' \
            --output text)

          echo "Command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query 'StandardOutputContent' \
            --output text