name: Production Deploy to Private EC2

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Git branch to deploy"
        required: true
        default: "main"

      version:
        description: "Semantic version tag (example: v1.0.0)"
        required: true
        default: "v1.0.0"

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  INSTANCE_ID: ${{ secrets.PROD_INSTANCE_ID }}

  ECR_BACKEND_REPO: minishop-backend
  ECR_FRONTEND_REPO: minishop-frontend

jobs:
  deploy:
    name: Build, Push to ECR and Deploy
    runs-on: ubuntu-latest
    environment: production

    steps:
      # Checkout repository
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}

      # Basic test
      - name: Run basic tests
        run: |
          echo "Running basic validation..."
          test -f docker-compose.yaml
          echo "Tests passed."

      # Configure AWS credentials using OIDC
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Login to Amazon ECR
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Set image variables
      - name: Set image variables
        run: |
          echo "ECR_REGISTRY=${{ steps.login-ecr.outputs.registry }}" >> $GITHUB_ENV
          echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_ENV

      # Build Backend Image
      - name: Build backend image
        run: |
          docker build -t $ECR_REGISTRY/$ECR_BACKEND_REPO:$VERSION ./backend
          docker tag $ECR_REGISTRY/$ECR_BACKEND_REPO:$VERSION \
                     $ECR_REGISTRY/$ECR_BACKEND_REPO:latest

      # Build Frontend Image
      - name: Build frontend image
        run: |
          docker build -t $ECR_REGISTRY/$ECR_FRONTEND_REPO:$VERSION ./frontend
          docker tag $ECR_REGISTRY/$ECR_FRONTEND_REPO:$VERSION \
                     $ECR_REGISTRY/$ECR_FRONTEND_REPO:latest

      # Push Backend Image
      - name: Push backend image to ECR
        run: |
          docker push $ECR_REGISTRY/$ECR_BACKEND_REPO:$VERSION
          docker push $ECR_REGISTRY/$ECR_BACKEND_REPO:latest

      # Push Frontend Image
      - name: Push frontend image to ECR
        run: |
          docker push $ECR_REGISTRY/$ECR_FRONTEND_REPO:$VERSION
          docker push $ECR_REGISTRY/$ECR_FRONTEND_REPO:latest

      # Deploy to private EC2 using AWS Systems Manager (SSM)
      - name: Deploy application via SSM
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Production deployment from GitHub Actions" \
            --parameters 'commands=[
              "set -e",
              "aws ecr get-login-password --region '${{ env.AWS_REGION }}' | docker login --username AWS --password-stdin '${{ env.ECR_REGISTRY }}'",
              "cd /app",
              "docker compose pull",
              "docker compose up -d",
              "docker image prune -af"
            ]' \
            --query 'Command.CommandId' \
            --output text)

          echo "Command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query 'StandardOutputContent' \
            --output text